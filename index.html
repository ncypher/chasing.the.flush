<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chasing the Flush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A 3D mushroom-foraging game. Chase the spring morel flush through a Michigan hardwood woodland - and don't pick the lookalikes.">
<meta name="theme-color" content="#101a10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182414'/%3E%3Crect x='13' y='17' width='6' height='10' rx='2' fill='%23efe6cf'/%3E%3Cellipse cx='16' cy='13' rx='7' ry='9' fill='%23d2ab4e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" aria-label="Game view"></canvas>

<div id="hud" class="hidden">
  <div id="hud-day" class="panel">
    <div class="row"><b id="hud-daynum">Day 1 / 10</b><span id="hud-date">April 22</span></div>
    <div class="row sub"><span id="hud-clock">7:00 AM</span><span id="hud-sky">Sunny</span></div>
    <div class="bar"><i id="hud-daybar"></i></div>
  </div>
  <div id="hud-weather" class="panel">
    <div class="row"><span class="lbl">Soil temp</span><b id="hud-soil">--</b></div>
    <div class="row"><span class="lbl">Rain, 3 days</span><b id="hud-rain">--</b></div>
  </div>
  <div id="crosshair"></div>
  <div id="prompt" class="hidden"></div>
  <div id="hud-basket" class="panel"><span class="lbl">Basket: today / season</span><b id="hud-basket-n">0</b></div>
  <div id="hud-buttons">
    <button id="btn-notebook" class="chip" type="button">Notebook <kbd>N</kbd></button>
    <button id="btn-home" class="chip" type="button">Head home <kbd>H</kbd></button>
    <button id="btn-menu" class="chip" type="button">Menu <kbd>Esc</kbd></button>
  </div>
  <div id="hud-hints">WASD move &middot; Mouse look &middot; Shift sprint &middot; C crouch &middot; E inspect</div>
  <div id="toasts"></div>
</div>

<div id="touch" class="hidden">
  <div id="joy"><i></i></div>
  <button id="touch-inspect" class="big hidden" type="button">Inspect</button>
</div>

<div id="inspect" class="hidden">
  <div id="inspect-title">Unknown morel-like mushroom</div>
  <div id="inspect-hint">Drag to turn it over. Look at the cap, how it joins the stem, the colour.</div>
  <div id="inspect-result" class="hidden"></div>
  <div id="inspect-actions">
    <button id="act-cut" type="button">Cut in half <kbd>C</kbd></button>
    <button id="act-pick" class="primary" type="button">Pick it <kbd>P</kbd></button>
    <button id="act-leave" type="button">Leave it <kbd>Esc</kbd></button>
    <button id="act-notes" type="button">Notebook <kbd>N</kbd></button>
    <button id="act-done" class="primary hidden" type="button">Done</button>
  </div>
</div>

<div id="vignette-sick" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="loading"><div class="load-card"><h1>Chasing the Flush</h1><p id="load-msg">Waking the woods...</p><div class="bar"><i id="load-bar"></i></div></div></div>
<div id="fatal" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
